name: SNEAK — opening range scanner

# ── Timing ──────────────────────────────────────────────────────────────────
# The strike candle is 09:45–10:00 ET, so it CLOSES at 10:00:00 ET, which is
# 09:00:00 CT. confirm.py then waits 25s for Yahoo to finalise the bar. Nothing
# can publish a strike list before ~09:00:25 CT; the measured floor, deployed to
# Pages, is 09:01:05 CT. That floor is only reached when a runner is already
# booted and SLEEPING as the bar closes:
#
#   pre-warmed (run in flight, sleeping)   push 09:00:43 CT   Pages 09:01:05 CT
#   cold start after the close             push 09:05:46 CT   Pages 09:06:12 CT
#
# So the crons below are not aimed at the candle. They are aimed ~20-50 minutes
# BEFORE it, which is GitHub's normal cron drift, so that whenever a firing
# actually lands it is inside sneak/stage.py's arming window and can sit and
# sleep. Firing early costs idle runner time (free on a public repo); firing
# late costs minutes on the dashboard.
#
# Times are UTC and ET is not, so each slot is listed at both offsets. stage.py
# resolves from committed state rather than the clock, so the "wrong" one of
# each pair is a ~15s no-op and DST needs no maintenance.

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 07:30 ET EDT — prep
    - cron: "30 12 * * 1-5"   # 07:30 ET EST — prep
    - cron: "15 12 * * 1-5"   # 08:15 ET EDT ─┐
    - cron: "35 12 * * 1-5"   # 08:35 ET EDT  │ arming band for the stalk:
    - cron: "55 12 * * 1-5"   # 08:55 ET EDT  │ land in 09:00-09:45 ET and
    - cron: "15 13 * * 1-5"   # 09:15 ET EDT  │ sleep to the 09:45:25 bar,
    - cron: "35 13 * * 1-5"   # 09:35 ET EDT ─┘ then the strike run follows
    - cron: "55 13 * * 1-5"   # 08:55 ET EST
    - cron: "15 14 * * 1-5"   # 09:15 ET EST
    - cron: "35 14 * * 1-5"   # 09:35 ET EST

  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run"
        required: true
        default: "all"
        type: choice
        # prep-stalk and strike-publish are the two halves of a morning, for
        # driving a session by hand when the cron scheduler is not firing.
        # Run prep-stalk any time before 09:45 ET and strike-publish any time
        # before 10:00 ET — each sleeps to its own candle close, so early is
        # free. Both publish; every stage but skip/selftest rebuilds the
        # dashboard and pushes.
        options:
          - prep-stalk      # first half  — universe, levels, the 09:45 stalk
          - strike-publish  # second half — the 10:00 strike, then publish
          - prep
          - stalk
          - strike
          - publish
          - selftest
          - all

permissions:
  contents: write

# Runs are serialised, and that is load-bearing rather than incidental. While
# the stalk run sleeps toward 09:45, the next firing sits pending behind it and
# starts the moment stalk commits — already booted, in time to sleep toward
# 10:00. The queue is what pre-warms the strike.
concurrency:
  group: sneak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sneak:
    runs-on: ubuntu-latest
    # Generous because a run is *expected* to sit idle: a stalk armed at 09:00 ET
    # sleeps 45 minutes before it does any work. Worst case is a manual "all"
    # armed at 09:00 ET, which sleeps through both bars, ~62 minutes.
    timeout-minutes: 75
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # All the logic lives in sneak/stage.py. Keeping it out of the YAML avoids
      # the heredoc trap where a ::notice:: printed to stdout gets redirected
      # into $GITHUB_OUTPUT and fails the step.
      - name: Resolve stage
        id: stage
        run: python3 -m sneak.stage
        env:
          MANUAL: ${{ github.event.inputs.stage }}

      # Proves the API key and both model tiers work without needing a live
      # session — a normal out-of-hours run makes zero API calls.
      - name: Self-test — API key and model tiers
        if: steps.stage.outputs.stage == 'selftest'
        run: python3 -m sneak.triage --selftest

      - name: Prep — universe and previous-day levels
        if: contains(fromJSON('["prep","prep-stalk","all"]'), steps.stage.outputs.stage)
        run: python3 -m sneak.prep

      # scan_open sleeps until 09:45:25 ET before reading the tape.
      - name: Stalk — 08:45 CT red breaks
        if: contains(fromJSON('["stalk","prep-stalk","all"]'), steps.stage.outputs.stage)
        run: |
          test -f "data/cache/levels-$(TZ=America/New_York date +%F).json" || python3 -m sneak.prep
          python3 -m sneak.scan_open

      # confirm sleeps until 10:00:25 ET before reading the tape. Everything
      # from here to the end of the deploy job is on the critical path to the
      # 09:01 CT dashboard, so nothing slow belongs in between.
      - name: Strike — 09:00 CT sneaky confirmations
        if: contains(fromJSON('["strike","strike-publish","all"]'), steps.stage.outputs.stage)
        run: |
          python3 -m sneak.confirm
          python3 -m sneak.news --top 200
          python3 -m sneak.triage --top 200

      - name: Build dashboard
        if: steps.stage.outputs.stage != 'skip' && steps.stage.outputs.stage != 'selftest'
        run: python3 -m sneak.dashboard

      - name: Commit and push
        id: push
        if: steps.stage.outputs.stage != 'skip' && steps.stage.outputs.stage != 'selftest'
        run: |
          git config user.name  "sneak-bot"
          git config user.email "sneak@users.noreply.github.com"
          # Stalk/strike JSON is only needed to hand state between the two runs
          # and for 30 days of lookback. docs/archive.json keeps the index forever.
          find data/cache -name '*.json' -mtime +30 -delete 2>/dev/null || true
          git add -A docs data/cache data/universe.txt
          if git diff --cached --quiet; then
            # Normal for a repeated prep: it rebuilds levels-*.json, which is
            # gitignored, so there is nothing new to publish.
            echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "🥷 SNEAK ${{ steps.stage.outputs.stage }} $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            if git push; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected, rebasing…"; git pull --rebase --autostash; sleep $((i*5))
          done
          echo "::error::push failed after 3 attempts"; exit 1

  # Deploy only when the scanner actually pushed something. Before this guard
  # every no-op firing — a skip, or a repeated prep that commits nothing —
  # burned a full Pages deployment republishing identical bytes.
  deploy:
    needs: sneak
    if: always() && needs.sneak.result == 'success' && needs.sneak.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
