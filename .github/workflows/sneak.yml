name: SNEAK ??? opening range scanner

# ?????? Timing ?????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
# Everything is anchored to the 15-minute candle boundaries in ET:
#
#   bar 1  09:30???09:45 ET  =  08:30???08:45 CT   ??? the stalk runs when it closes
#   bar 2  09:45???10:00 ET  =  08:45???09:00 CT   ??? the strike runs when it closes
#
# GitHub's cron is UTC-only and can drift several minutes under load, so each
# stage is scheduled TWICE ??? once for CDT and once for CST ??? and starts ~25
# minutes early. A guard step exits whichever firing is the wrong one for the
# current offset, and the scanner itself then sleeps until the exact second the
# candle closes. Drift therefore costs idle runner time, never a late list.

on:
  schedule:
    # prep ??? universe + previous-day levels. Not time critical.
    - cron: "0 12 * * 1-5"    # 08:00 ET (CDT) / 07:00 ET (CST)
    - cron: "0 13 * * 1-5"    # 09:00 ET (CDT) / 08:00 ET (CST)
    # stalk ??? fires ~09:20 ET under one of the two offsets
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    # strike ??? fires ~09:50 ET under one of the two offsets
    - cron: "50 13 * * 1-5"
    - cron: "50 14 * * 1-5"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run"
        required: true
        default: "all"
        type: choice
        options: [prep, stalk, strike, publish, selftest, all]

permissions:
  contents: write

concurrency:
  group: sneak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sneak:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # All the logic lives in sneak/stage.py. Keeping it out of the YAML avoids
      # the heredoc trap where a ::notice:: printed to stdout gets redirected
      # into $GITHUB_OUTPUT and fails the step.
      - name: Resolve stage
        id: stage
        run: python3 -m sneak.stage
        env:
          MANUAL: ${{ github.event.inputs.stage }}

      # Proves the API key and both model tiers work without needing a live
      # session ??? a normal out-of-hours run makes zero API calls.
      - name: Self-test ??? API key and model tiers
        if: steps.stage.outputs.stage == 'selftest'
        run: python3 -m sneak.triage --selftest

      - name: Prep ??? universe and previous-day levels
        if: steps.stage.outputs.stage == 'prep' || steps.stage.outputs.stage == 'all'
        run: python3 -m sneak.prep

      # scan_open sleeps until 09:45:25 ET before reading the tape.
      - name: Stalk ??? 08:45 CT red breaks
        if: steps.stage.outputs.stage == 'stalk' || steps.stage.outputs.stage == 'all'
        run: |
          test -f "data/cache/levels-$(TZ=America/New_York date +%F).json" || python3 -m sneak.prep
          python3 -m sneak.scan_open

      # confirm sleeps until 10:00:25 ET before reading the tape.
      - name: Strike ??? 09:00 CT sneaky confirmations
        if: steps.stage.outputs.stage == 'strike' || steps.stage.outputs.stage == 'all'
        run: |
          python3 -m sneak.confirm
          python3 -m sneak.news --top 200
          python3 -m sneak.triage --top 200

      - name: Build dashboard
        if: steps.stage.outputs.stage != 'skip' && steps.stage.outputs.stage != 'selftest'
        run: python3 -m sneak.dashboard

      - name: Commit and push
        if: steps.stage.outputs.stage != 'skip' && steps.stage.outputs.stage != 'selftest'
        run: |
          git config user.name  "sneak-bot"
          git config user.email "sneak@users.noreply.github.com"
          # Stalk/strike JSON is only needed to hand state between the two runs
          # and for 30 days of lookback. docs/archive.json keeps the index forever.
          find data/cache -name '*.json' -mtime +30 -delete 2>/dev/null || true
          git add -A docs data/cache data/universe.txt
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "???? SNEAK ${{ steps.stage.outputs.stage }} $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing???"; git pull --rebase --autostash; sleep $((i*5))
          done
          echo "::error::push failed after 3 attempts"; exit 1

  deploy:
    needs: sneak
    if: always() && needs.sneak.result == 'success' && needs.sneak.outputs.stage != 'selftest'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
