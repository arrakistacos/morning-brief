name: SNEAK — opening range scanner

# ── How a morning runs ──────────────────────────────────────────────────────
# By hand: Actions → SNEAK → Run workflow → `all` at ~08:55 CT. One job does the
# whole morning. Measured from the manual runs on 09-10, 09-16 and 10-08:
#
#   08:55:00 CT  click — runner up, deps installed           ~25s
#   08:55:50     prep (universe + levels) and stalk done     ~30s
#   09:00:25     strike reads the closed 09:45-10:00 ET candle (it sleeps until then)
#   09:00:45     news + model read + commit                  ~20s
#   09:01:15     Pages live — the buy-stop window runs to 09:15 CT
#
# Click by ~08:59 CT to be on time; until 09:14 it still works, just later. Not
# before 07:55 CT: the sleep would outlive the 75-minute timeout, and stage.py
# refuses (red X) rather than letting it die halfway.
#
# There is no cron schedule. GitHub's scheduler started this repo's runs 3.5-6
# hours late from late August on, so every on-time session came from a manual
# start anyway. To automate later, have an external clock (cron-job.org or
# similar) POST to
#   https://api.github.com/repos/arrakistacos/morning-brief/actions/workflows/sneak.yml/dispatches
# with {"ref":"main","inputs":{"stage":"all"}} at 08:30-08:55 America/Chicago on
# weekdays, using a fine-grained token with Actions: write on this repo. stage.py
# skips non-trading days and days already published, so extra calls are no-ops.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (all = the whole morning; click at ~08:55 CT)"
        required: true
        default: "all"
        type: choice
        # `all` is the morning. The rest are for debugging, or for driving a
        # session in two halves: prep-stalk any time before 09:45 ET and
        # strike-publish any time before 10:00 ET — each sleeps to its own
        # candle close. Every stage but skip/selftest rebuilds the dashboard
        # and pushes.
        options:
          - all
          - selftest
          - prep-stalk      # first half  — universe, levels, the 09:45 stalk
          - strike-publish  # second half — the 10:00 strike, then publish
          - prep
          - stalk
          - strike
          - publish

permissions:
  contents: write

# Runs are serialised so two clicks (or a click plus an external trigger) can
# never commit over each other. The second one waits, then finds the day already
# published and skips.
concurrency:
  group: sneak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sneak:
    runs-on: ubuntu-latest
    # Generous because a run may sit idle: an `all` started early sleeps through
    # both candles. stage.py refuses any start that would outlive this.
    timeout-minutes: 75
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      # Check out the branch tip as it is when the job STARTS, not the commit the
      # run was queued at. A run that waited behind another (concurrency) then
      # sees the morning the first one already committed, and skips.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # All the logic lives in sneak/stage.py. Keeping it out of the YAML avoids
      # the heredoc trap where a ::notice:: printed to stdout gets redirected
      # into $GITHUB_OUTPUT and fails the step.
      - name: Resolve stage
        id: stage
        run: python3 -m sneak.stage
        env:
          MANUAL: ${{ github.event.inputs.stage }}

      # Proves the API key and both model tiers work without needing a live
      # session — a normal out-of-hours run makes zero API calls.
      - name: Self-test — API key and model tiers
        if: steps.stage.outputs.stage == 'selftest'
        run: python3 -m sneak.triage --selftest

      - name: Prep — universe and previous-day levels
        if: contains(fromJSON('["prep","prep-stalk","all"]'), steps.stage.outputs.stage)
        run: python3 -m sneak.prep

      # scan_open sleeps until 09:45:25 ET before reading the tape.
      - name: Stalk — 08:45 CT red breaks
        if: contains(fromJSON('["stalk","prep-stalk","all"]'), steps.stage.outputs.stage)
        run: |
          test -f "data/cache/levels-$(TZ=America/New_York date +%F).json" || python3 -m sneak.prep
          python3 -m sneak.scan_open

      # confirm sleeps until 10:00:25 ET before reading the tape. Everything
      # from here to the end of the deploy job is on the critical path to the
      # 09:01 CT dashboard, so nothing slow belongs in between.
      - name: Strike — 09:00 CT sneaky confirmations
        if: contains(fromJSON('["strike","strike-publish","all"]'), steps.stage.outputs.stage)
        run: |
          python3 -m sneak.confirm
          python3 -m sneak.news --top 200
          python3 -m sneak.triage --top 200

      - name: Build dashboard
        if: steps.stage.outputs.stage != 'skip' && steps.stage.outputs.stage != 'selftest'
        run: python3 -m sneak.dashboard

      - name: Commit and push
        id: push
        if: steps.stage.outputs.stage != 'skip' && steps.stage.outputs.stage != 'selftest'
        run: |
          git config user.name  "sneak-bot"
          git config user.email "sneak@users.noreply.github.com"
          # Stalk/strike JSON is only needed to hand state between the two runs
          # and for 30 days of lookback. docs/archive.json keeps the index forever.
          python3 -m sneak.prune --days 30
          git add -A docs data/cache data/universe.txt
          if git diff --cached --quiet; then
            # Normal for a repeated prep: it rebuilds levels-*.json, which is
            # gitignored, so there is nothing new to publish.
            echo "nothing to commit"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "🥷 SNEAK ${{ steps.stage.outputs.stage }} $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')"
          for i in 1 2 3; do
            if git push; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected, rebasing…"; git pull --rebase --autostash; sleep $((i*5))
          done
          echo "::error::push failed after 3 attempts"; exit 1

  # Deploy only when the scanner actually pushed something. Before this guard
  # every no-op firing — a skip, or a repeated prep that commits nothing —
  # burned a full Pages deployment republishing identical bytes.
  deploy:
    needs: sneak
    if: always() && needs.sneak.result == 'success' && needs.sneak.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
