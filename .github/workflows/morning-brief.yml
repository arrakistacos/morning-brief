name: Morning Brief

on:
  schedule:
    - cron: '0 10 * * 1-5'  # 10 AM UTC = 6 AM ET, Mon-Fri
  workflow_dispatch:          # Allow manual trigger for testing

jobs:
  run-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need to commit the reports

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Brief
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: capt.computermail@gmail.com
        run: python main.py

      - name: Commit reports
        run: |
          git config user.email "morning-brief@github-actions"
          git config user.name "Morning Brief Bot"
          git add reports/
          git diff --staged --quiet || git commit -m "📊 Morning Brief $(date '+%Y-%m-%d')"
          git push

      - name: Trigger Pages rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: reports-updated
